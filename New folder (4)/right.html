<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abbas – Groom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Great+Vibes&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #C87C96;
    --gold-light: #EDCCD8;
    --dark: #1A1215;
  }

  html, body {
    width: 100%; min-height: 100%;
    background: var(--dark);
    overflow-x: hidden;
    font-family: 'Lato', sans-serif;
    color: #fff;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(200,124,150,0.04) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── BACK BUTTON ── */
  .back-btn {
    position: fixed;
    top: 1.4rem; left: 1.4rem;
    z-index: 999;
    display: flex; align-items: center; gap: 6px;
    padding: 0.55rem 1.2rem;
    background: rgba(200,124,150,0.85);
    backdrop-filter: blur(10px);
    color: #fff; text-decoration: none;
    border-radius: 50px;
    font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase;
    box-shadow: 0 4px 20px rgba(200,124,150,0.4);
    transition: background 0.3s, transform 0.3s;
  }
  .back-btn:hover { background: #9A5A72; transform: translateY(-2px); }

  /* ── PAGE HERO ── */
  .page-hero {
    position: relative;
    z-index: 1;
    min-height: 42vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8rem 2rem 3.5rem;
    background: radial-gradient(ellipse at 50% 0%, rgba(200,124,150,0.18) 0%, transparent 70%);
  }

  .page-hero::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 1px; height: 60px;
    background: linear-gradient(to bottom, rgba(200,124,150,0.4), transparent);
  }

  .page-hero h1 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(3.5rem, 10vw, 7rem);
    background: linear-gradient(135deg, #fff 0%, #EDCCD8 45%, #C87C96 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 2px 20px rgba(200,124,150,0.4));
    line-height: 1;
    margin-bottom: 0.6rem;
  }

  .page-hero-sub {
    font-size: 0.68rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(237,204,216,0.45);
    margin-bottom: 2rem;
  }

  .ornament {
    display: flex; justify-content: center;
    margin: 0.5rem auto 0;
    opacity: 0.6;
  }
  .ornament svg { width: 200px; height: 18px; }

  /* ── WALL SECTION ── */
  .wall-section {
    position: relative; z-index: 1;
    padding: 5rem 2rem 7rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  .wall-eyebrow {
    text-align: center;
    font-size: 0.66rem;
    letter-spacing: 0.48em;
    text-transform: uppercase;
    color: rgba(200,124,150,0.5);
    margin-bottom: 3rem;
  }

  .fb-notice {
    text-align: center;
    background: rgba(200,124,150,0.06);
    border: 1px solid rgba(200,124,150,0.18);
    border-radius: 8px;
    padding: 1.2rem 1.8rem;
    max-width: 520px;
    margin: 0 auto 3rem;
    font-size: 0.8rem;
    color: rgba(237,204,216,0.5);
    line-height: 1.7;
    display: none;
  }
  .fb-notice.show { display: block; }

  .msg-wall {
    column-count: 3;
    column-gap: 1.4rem;
  }
  @media (max-width: 800px) { .msg-wall { column-count: 2; } }
  @media (max-width: 480px) { .msg-wall { column-count: 1; } }

  .msg-empty {
    column-span: all;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.15rem;
    color: rgba(200,124,150,0.32);
    padding: 5rem 0;
  }

  .msg-card {
    break-inside: avoid;
    background: rgba(200,124,150,0.06);
    border: 1px solid rgba(200,124,150,0.13);
    border-radius: 8px;
    padding: 1.4rem 1.5rem;
    margin-bottom: 1.4rem;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.55s ease, transform 0.55s ease,
                background 0.3s, border-color 0.3s;
  }
  .msg-card.visible { opacity: 1; transform: translateY(0); }
  .msg-card:hover {
    background: rgba(200,124,150,0.1);
    border-color: rgba(200,124,150,0.28);
  }

  .msg-card-img {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    border-radius: 4px;
    margin-bottom: 1rem;
    display: block;
  }

  .msg-card-bar {
    width: 24px; height: 1px;
    background: var(--gold);
    opacity: 0.5;
    margin-bottom: 0.7rem;
  }

  .msg-card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: #fff;
    margin-bottom: 0.3rem;
  }

  .msg-card-text {
    font-size: 0.84rem;
    color: rgba(237,204,216,0.65);
    line-height: 1.65;
    word-break: break-word;
  }

  .msg-card-date {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(200,124,150,0.4);
    margin-top: 0.8rem;
  }

  .pdf-export-btn {
    display: flex; align-items: center; gap: 8px;
    margin: 2.5rem auto 0;
    padding: 0.7rem 2.2rem;
    background: rgba(200,124,150,0.12);
    border: 1px solid rgba(200,124,150,0.38);
    border-radius: 50px;
    color: rgba(237,204,216,0.8);
    font-family: 'Lato', sans-serif;
    font-size: 0.7rem; letter-spacing: 0.26em; text-transform: uppercase;
    cursor: pointer;
    transition: background 0.3s, color 0.3s, transform 0.3s;
  }
  .pdf-export-btn:hover:not(:disabled) { background: rgba(200,124,150,0.28); color: #fff; transform: translateY(-2px); }
  .pdf-export-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>

<a href="index.html" class="back-btn">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  Back
</a>

<div class="page-hero">
  <h1>Abbas</h1>
  <p class="page-hero-sub">Family of the Groom</p>
  <div class="ornament">
    <svg viewBox="0 0 200 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" y1="9" x2="76" y2="9" stroke="#C87C96" stroke-width="0.5" opacity="0.6"/>
      <path d="M82 9 L88 3 L94 9 L88 15 Z" fill="none" stroke="#C87C96" stroke-width="0.8" opacity="0.4"/>
      <path d="M85 9 L88 6 L91 9 L88 12 Z" fill="#C87C96" opacity="0.6"/>
      <circle cx="100" cy="9" r="2.5" fill="#C87C96" opacity="0.85"/>
      <path d="M106 9 L109 6 L112 9 L109 12 Z" fill="#C87C96" opacity="0.6"/>
      <path d="M106 9 L112 3 L118 9 L112 15 Z" fill="none" stroke="#C87C96" stroke-width="0.8" opacity="0.4"/>
      <line x1="124" y1="9" x2="200" y2="9" stroke="#C87C96" stroke-width="0.5" opacity="0.6"/>
    </svg>
  </div>
</div>

<div class="wall-section">
  <p class="wall-eyebrow">Messages of Love</p>
  <div class="fb-notice" id="fb-notice">
    Connect Firebase on the main page to see messages here.
  </div>
  <div class="msg-wall" id="msg-wall">
    <p class="msg-empty" id="msg-empty">Messages for Abbas will appear here ♡</p>
  </div>
  <button class="pdf-export-btn" onclick="exportWallToPDF('msg-wall','Abbas',this)">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Save as PDF &amp; Share
  </button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script>
/*
  ⚠️  Paste the same Firebase config from index.html here
*/
const FB_CONFIG = {
  apiKey:            "",
  authDomain:        "",
  projectId:         "",
  storageBucket:     "",
  messagingSenderId: "",
  appId:             ""
};

const FB_READY = FB_CONFIG.apiKey !== "";
const wall     = document.getElementById('msg-wall');

function safe(str) {
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}

function addCard(data, id, prepend) {
  const empty = document.getElementById('msg-empty');
  if (empty) empty.remove();
  if (document.querySelector(`.msg-card[data-id="${id}"]`)) return;

  const dateStr = data.ts?.toDate
    ? data.ts.toDate().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
    : 'Just now';

  const card = document.createElement('div');
  card.className = 'msg-card';
  card.dataset.id = id;
  card.innerHTML =
    (data.img ? `<img class="msg-card-img" src="${safe(data.img)}" alt="" loading="lazy">` : '') +
    `<div class="msg-card-bar"></div>
     <p class="msg-card-name">${safe(data.name)}</p>
     <p class="msg-card-text">${safe(data.msg)}</p>
     <p class="msg-card-date">${dateStr}</p>`;

  if (prepend) wall.prepend(card); else wall.appendChild(card);
  setTimeout(() => card.classList.add('visible'), 60);
}

if (FB_READY) {
  firebase.initializeApp(FB_CONFIG);
  const db = firebase.firestore();

  let initialLoaded = false;
  db.collection('guestbook')
    .orderBy('ts', 'desc')
    .onSnapshot(snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type !== 'added') return;
        const data   = ch.doc.data();
        const forVal = data.for || 'both';
        if (forVal === 'both' || forVal === 'abbas') {
          addCard(data, ch.doc.id, initialLoaded);
        }
      });
      initialLoaded = true;
    }, err => console.warn('Firestore:', err));
} else {
  document.getElementById('fb-notice').classList.add('show');
  const stored = JSON.parse(localStorage.getItem('wedding_guestbook') || '[]');
  stored.forEach(m => {
    const fv = m.for || 'both';
    if (fv === 'both' || fv === 'abbas') addCard(m, m.id, false);
  });
}

async function exportWallToPDF(wallId, personName, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }

  if (!window.jspdf) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }

  const { jsPDF } = window.jspdf;
  const wall  = document.getElementById(wallId);
  const cards = wall.querySelectorAll('.panel-card, .msg-card');

  if (!cards.length) {
    alert('No messages yet ♡');
    if (btn) { btn.disabled = false; btn.textContent = 'Save as PDF & Share'; }
    return;
  }

  function imgToDataURL(imgEl) {
    return new Promise(resolve => {
      if (!imgEl || !imgEl.src) return resolve(null);
      const draw = img => {
        try {
          const c = document.createElement('canvas');
          c.width = img.naturalWidth || 300; c.height = img.naturalHeight || 300;
          c.getContext('2d').drawImage(img, 0, 0);
          resolve(c.toDataURL('image/jpeg', 0.75));
        } catch { resolve(null); }
      };
      if (imgEl.complete && imgEl.naturalWidth) return draw(imgEl);
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => draw(img);
      img.onerror = () => resolve(null);
      img.src = imgEl.src;
    });
  }

  const doc      = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageW    = doc.internal.pageSize.getWidth();
  const pageH    = doc.internal.pageSize.getHeight();
  const margin   = 18;
  const contentW = pageW - margin * 2;
  let y = margin;

  doc.setFillColor(26, 18, 21);
  doc.rect(0, 0, pageW, 40, 'F');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18); doc.setTextColor(200, 124, 150);
  doc.text('Messages of Love', pageW / 2, y + 9, { align: 'center' });
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11); doc.setTextColor(237, 204, 216);
  doc.text('For ' + personName, pageW / 2, y + 18, { align: 'center' });
  doc.setFontSize(8); doc.setTextColor(160, 110, 135);
  doc.text('Abbas & Zena  ·  August 26, 2026', pageW / 2, y + 25, { align: 'center' });
  y = 48;

  for (const card of cards) {
    const name  = (card.querySelector('.panel-card-name,.msg-card-name')?.textContent || '').trim();
    const text  = (card.querySelector('.panel-card-text,.msg-card-text')?.textContent || '').trim();
    const date  = (card.querySelector('.panel-card-date,.msg-card-date')?.textContent || '').trim();
    const imgEl = card.querySelector('.panel-card-photo,.msg-card-img');

    doc.setFontSize(9);
    const wrapped = doc.splitTextToSize(text, contentW - 14);

    let imgData = null;
    const imgThumb = 14;
    if (imgEl) imgData = await imgToDataURL(imgEl);

    const cardH = Math.max(7 + 5 + wrapped.length * 4.8 + 5, imgData ? imgThumb + 8 : 0);

    if (y + cardH > pageH - margin) { doc.addPage(); y = margin; }

    doc.setFillColor(255, 248, 252);
    doc.roundedRect(margin, y, contentW, cardH, 2, 2, 'F');
    doc.setDrawColor(220, 170, 190); doc.setLineWidth(0.2);
    doc.roundedRect(margin, y, contentW, cardH, 2, 2, 'S');
    doc.setFillColor(200, 124, 150);
    doc.roundedRect(margin, y, 3, cardH, 1, 1, 'F');

    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(60, 30, 50);
    doc.text(name, margin + 8, y + 6);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(160, 100, 130);
    doc.text(date, pageW - margin - 3, y + 6, { align: 'right' });
    doc.setDrawColor(200, 124, 150); doc.setLineWidth(0.15);
    doc.line(margin + 8, y + 8.5, pageW - margin - 3, y + 8.5);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(70, 40, 60);
    doc.text(wrapped, margin + 8, y + 13);

    if (imgData) {
      const ix = pageW - margin - 4 - imgThumb;
      const iy = y + 3;
      doc.addImage(imgData, 'JPEG', ix, iy, imgThumb, imgThumb);
      doc.setDrawColor(200, 124, 150); doc.setLineWidth(0.3);
      doc.roundedRect(ix, iy, imgThumb, imgThumb, 1, 1, 'S');
    }

    y += cardH + 4;
  }

  const total = doc.internal.getNumberOfPages();
  for (let p = 1; p <= total; p++) {
    doc.setPage(p);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(180, 130, 155);
    doc.text('Abbas & Zena  ·  ' + new Date().toLocaleDateString('en-GB') + '  ·  ' + p + ' / ' + total,
      pageW / 2, pageH - 6, { align: 'center' });
  }

  const filename = personName + '_Messages_AbbasZena.pdf';
  const pdfBlob  = doc.output('blob');
  const file     = new File([pdfBlob], filename, { type: 'application/pdf' });

  if (navigator.share && navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Messages for ' + personName + ' ♡' }); }
    catch (e) { if (e.name !== 'AbortError') doc.save(filename); }
  } else {
    doc.save(filename);
  }

  if (btn) {
    btn.disabled = false;
    btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Save as PDF &amp; Share';
  }
}
</script>
</body>
</html>
